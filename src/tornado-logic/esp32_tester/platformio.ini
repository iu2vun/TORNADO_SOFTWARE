; Tester per analizzatore logico (generatore di pattern noti). Scheda generica ESP32 DevKit: adattare `board`
; alla propria scheda e verificare i pin in include/config.h.
[env:esp32dev]
platform = espressif32@6.9.0      ; core Arduino-ESP32 2.0.17 (le API ledc* usate qui sono quelle del core 2.x)
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
